name: Deploy LoadRoute to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # IP Pública actual del Front/Back
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Entrar al directorio del proyecto
            cd /var/www/loadroute
            
            # 2. Bajar los últimos cambios de GitHub
            git pull origin main

            # 3. DESPLIEGUE DEL FRONTEND (Next.js - Modo Estático Especializado)
            echo "Iniciando despliegue de Frontend (Next.js)..."
            cd LoadRoute-Frontend
            npm install
            
            # Limpiamos compilaciones anteriores
            rm -rf .next out
            
            # Usamos la ruta relativa "/api". Así Nginx procesa todo en el puerto 80 sin importar la IP externa.
            NEXT_PUBLIC_BACKEND_URL="/api" NODE_ENV=production npm run build
            
            # Reiniciamos PM2 usando la herramienta de servicio estático 'serve' en el puerto 3000
            pm2 restart loadroute-front || pm2 start serve --name "loadroute-front" -- -s out -l 3000
            pm2 save
            cd ..

            # 4. DESPLIEGUE DEL BACKEND (Java)
            echo "Iniciando despliegue de Backend (Java)..."
            cd LoadRoute-Backend
            
            # Forzamos la creación del archivo .env con la IP privada de la BD del secreto de hoy
            echo "Generando archivo .env dinámico..."
            rm -f .env
            echo "DB_URL=jdbc:mysql://${{ secrets.DB_HOST }}:3306/loadroute?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true" > .env
            echo "DB_USERNAME=loadroute_user" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            
            # Compilar usando el Maven del servidor
            mvn clean package -DskipTests
            
            # Reiniciar el backend para que cargue el nuevo archivo .env e impacte el cambio de BD
            sudo systemctl restart loadroute-backend.service
            
            echo "¡Despliegue de LoadRoute completado con éxito!"
