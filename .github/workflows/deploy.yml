name: Deploy LoadRoute to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Entrar al directorio REAL del proyecto en el servidor
            cd /var/www/loadroute
            
            # 2. Bajar los últimos cambios de la rama correspondiente
            git pull origin main
            
            # 3. DESPLIEGUE DEL FRONTEND (Next.js)
            echo "Iniciando despliegue de Frontend (Next.js)..."
            cd LoadRoute-Frontend
            npm install
            
            # Forzamos la inyección de la IP de AWS en el build de Next.js
            NEXT_PUBLIC_BACKEND_URL="http://13.218.21.70" NODE_ENV=production npm run build
            
            # Reiniciar garantizando que PM2 use la IP pública y el puerto 3000
            NEXT_PUBLIC_BACKEND_URL="http://13.218.21.70" PORT=3000 pm2 restart loadroute-front || NEXT_PUBLIC_BACKEND_URL="http://13.218.21.70" PORT=3000 pm2 start npm --name "loadroute-front" -- start
            pm2 save
            cd ..

            # 4. DESPLIEGUE DEL BACKEND (Java)
            echo "Iniciando despliegue de Backend (Java)..."
            cd LoadRoute-Backend
            
            # Compilar usando el Maven global instalado en el servidor
            mvn clean package -DskipTests
            
            # Reiniciar el servicio que maneja el archivo .jar
            sudo systemctl restart loadroute-backend.service
            
            echo "¡Despliegue de LoadRoute completado con éxito!"