spring:
  application:
    name: loadroute-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loadroute}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  # File upload configuration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.loadroute: DEBUG
